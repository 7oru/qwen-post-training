# Conservative Mac-local SFT profiles.
model:
  base: mlx-community/Qwen2.5-7B-Instruct-4bit
  upstream_reference: Qwen/Qwen2.5-7B-Instruct

data:
  train: data/processed/sft/train.jsonl
  validation: data/processed/sft/validation.jsonl
  test: data/processed/sft/test.jsonl

training:
  adapter: lora
  batch_size: 1
  gradient_accumulation_steps: 8
  max_seq_length: 512
  lora_rank: 4
  lora_dropout: 0.0
  lora_scale: 20.0
  trainable_layers: 4
  mask_prompt_tokens: true
  learning_rate: 0.00001
  steps_per_report: 1
  test: true
  grad_checkpoint: true
  seed: 7
  output_dir: adapters/sft

profiles:
  smoke:
    iters: 10
    val_batches: 2
    steps_per_eval: 5
    save_every: 10
    test_batches: 2

  local_16gb:
    iters: 200
    val_batches: 10
    steps_per_eval: 50
    save_every: 50
    test_batches: 10

logging:
  output_dir: runs/sft
  eval_prompts: data/eval/prompts.jsonl
