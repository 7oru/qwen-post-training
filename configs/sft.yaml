# Conservative 16 GB Mac mini SFT profile.
model:
  base: mlx-community/Qwen2.5-7B-Instruct-4bit
  upstream_reference: Qwen/Qwen2.5-7B-Instruct

data:
  train: data/processed/sft/train.jsonl
  validation: data/processed/sft/validation.jsonl
  test: data/processed/sft/test.jsonl

training:
  adapter: lora
  batch_size: 1
  gradient_accumulation_steps: 8
  max_seq_length: 512
  lora_rank: 4
  lora_dropout: 0.0
  lora_scale: 20.0
  trainable_layers: 4
  mask_prompt_tokens: true
  iters: 10
  val_batches: 2
  learning_rate: 0.00001
  steps_per_report: 1
  steps_per_eval: 5
  save_every: 10
  test: true
  test_batches: 2
  grad_checkpoint: true
  seed: 7
  output_dir: adapters/sft

logging:
  output_dir: runs/sft
  eval_prompts: data/eval/prompts.jsonl
